name: Deploy Finsy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Combine the app (site root) and the landing page (/landing)
        run: |
          mkdir -p site
          cp -r pwa/. site/
          mkdir -p site/landing
          cp -r landing/. site/landing/
          rm -rf site/landing/.taste-skill
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for artifact metadata to propagate
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
